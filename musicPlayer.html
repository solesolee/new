<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="stylesheet" href="musicstyle.css">
<link rel="stylesheet" href="globalstyle.css">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet"
 href="https://unpkg.com/@fontsource/jersey-10/index.css">
 <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

 
<div class="base">
  <a href="index.html">
   <header>
    <div class="backPage"><img src="image/backpage.svg"><p>Music Player</p></div>
  </header>
</a>

<div class="buble">
  
  <div class="textbox">
    <p id="typingText"></p>
 </div>
 
  
</div>
<div class="cardplayer">
 <div class="card">
  <div class="card-header">
    Your Favorite Music !
  </div>

  <div class="card-body">
    <div class="cover"><img src="image/CS888019-01A-BIG.jpg" alt="play"></div>

    <div class="info">
      <h2>About You</h2>
      <p>The 1975</p>

      <div class="progress" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <audio class="audio" src="sound/The 1975 - About You.mp3"></audio>

        <div class="controls">
        <img class="backIcon" src="image/back.svg" alt="back">
            <button class="playBtn">
                <img class="playIcon" src="image/play.svg" alt="play">
            </button>
        <img class="nextIcon" src="image/next.svg" alt="next">

        </div>
    </div>
  </div>
 </div>
  <div class="card" id="card2">
  <div class="card-header">
    Your Favorite Music !
  </div>

  <div class="card-body">
    <div class="cover"><img src="image/CS888019-01A-BIG.jpg" alt="play"></div>

    <div class="info">
      <h2>Abou</h2>
      <p>The 1975</p>

      <div class="progress" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <audio class="audio" src="sound/The 1975 - About You.mp3"></audio>

        <div class="controls">
        <img class="backIcon" src="image/back.svg" alt="back">
            <button class="playBtn">
                <img class="playIcon" src="image/play.svg" alt="play">
            </button>
        <img class="nextIcon" src="image/next.svg" alt="next">

        </div>
    </div>
  </div>

  
</div>
  
 </div>


<script src="script.js"></script>
</body>
</html>
